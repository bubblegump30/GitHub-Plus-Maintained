name: Assemble repaired userscript

on:
  push:
    branches:
      - main
    paths:
      - '.build/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect temporary payload
        id: payload
        shell: bash
        run: |
          if [[ -f .build/source.part01.b64 ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct userscript
        if: steps.payload.outputs.exists == 'true'
        shell: bash
        run: |
          cat .build/source.part*.b64 | base64 --decode | gzip --decompress > GitHub-Plus.user.js

      - name: Verify exact source hash
        if: steps.payload.outputs.exists == 'true'
        shell: bash
        run: |
          echo "bf0a3c80fa714f3f2cc1f55f2ac0a53da95955f16543e5df24f5d6c5a83d6222  GitHub-Plus.user.js" | sha256sum --check --strict

      - name: Validate JavaScript syntax
        if: steps.payload.outputs.exists == 'true'
        run: node --check GitHub-Plus.user.js

      - name: Write source checksum
        if: steps.payload.outputs.exists == 'true'
        shell: bash
        run: sha256sum GitHub-Plus.user.js > SHA256SUMS.txt

      - name: Remove temporary payload
        if: steps.payload.outputs.exists == 'true'
        shell: bash
        run: rm -rf .build

      - name: Commit verified userscript
        if: steps.payload.outputs.exists == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add GitHub Plus v0.7.2 compatibility hotfix"
          git push
